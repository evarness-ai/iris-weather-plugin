# Weather Now -- an IRIS tool plugin, generated by `iris plugin new`.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-plugin-weather-now"
version = "0.1.0"
description = "Weather Now: a weather-code tool, an Open-Meteo forecast tool, and the weather.forecast capability for IRIS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
# The stable tier this plugin is written against (docs/reference/stable-api.md): a 0.x
# minor release may remove what the one before it deprecated.
dependencies = ["iris-harness>=0.1,<0.2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

# How IRIS finds the plugin once it is installed. The entry-point name is the plugin's
# name, the one a profile lists; the manifest ships in the package (package data).
[project.entry-points."iris_harness.plugins"]
weather-now = "iris_plugin_weather_now.plugin:setup"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iris_plugin_weather_now = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S"]
# E501: black owns line length (it leaves long strings alone); S101: pytest asserts.
ignore = ["E501", "S101"]
